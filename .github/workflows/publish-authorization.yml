name: Publish authorization manifest

on:
  push:
    paths:
      - auth/manifest.source.json
      - .github/scripts/Sign-AuthorizationManifest.ps1
      - .github/workflows/publish-authorization.yml
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"

permissions: {}

concurrency:
  group: pages-authorization
  cancel-in-progress: true

jobs:
  sign:
    name: Sign authorization manifest
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: auth-signing
    permissions:
      contents: read
      pages: read

    steps:
      - name: Check out signer inputs
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            auth/manifest.source.json
            .github/scripts/Sign-AuthorizationManifest.ps1
          sparse-checkout-cone-mode: false

      - name: Create signed authorization envelope
        shell: pwsh
        env:
          AUTH_MANIFEST_SIGNING_KEY_PEM: ${{ secrets.AUTH_MANIFEST_SIGNING_KEY_PEM }}
          AUTH_MANIFEST_SIGNING_PUBLIC_KEY_SHA256: ${{ vars.AUTH_MANIFEST_SIGNING_PUBLIC_KEY_SHA256 }}
        run: >-
          ./.github/scripts/Sign-AuthorizationManifest.ps1
          -SourcePath ./auth/manifest.source.json
          -OutputDirectory ./_site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload signed Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: ./_site
          retention-days: 1

  deploy:
    name: Deploy authorization manifest
    needs: sign
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
